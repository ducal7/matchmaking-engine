[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchmaking"
version = "0.1.0"
description = "Skill-based matchmaking simulator with pluggable rating systems (Elo, Glicko-2)."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [{ name = "Aditya Singh Rathore", email = "adityasinh0707@gmail.com" }]
dependencies = [
    "numpy==1.26.4",
    "simpy==4.1.1",
    "pandas==2.2.2",
    "matplotlib==3.8.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "ruff==0.5.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
